name: Update question bank
on:
  schedule:
    - cron: '0 20 * * *'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/generate.mjs
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      - name: Commit changes
        run: |
          git config user.name "question-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data/questions.json
          git diff --cached --quiet || (git commit -m "Update question bank" && git push)
